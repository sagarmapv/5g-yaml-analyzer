name: GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Export static demo
        run: python scripts/export_static_demo.py

      - name: Patch demo HTML for relative assets
        run: |
          python -c "
          from pathlib import Path
          for name in ('ladder.html', 'master-story.html'):
              p = Path('docs') / name
              if not p.exists():
                  continue
              t = p.read_text(encoding='utf-8')
              t = t.replace('href=\"/static/', 'href=\"./static/')
              t = t.replace('src=\"/static/', 'src=\"./static/')
              t = t.replace('href=\"/', 'href=\"./')
              if 'demo-loader.js' not in t:
                  t = t.replace('<script src=\"./static/site-nav.js\">', '<script src=\"./static/demo-loader.js\"></script>\n  <script src=\"./static/site-nav.js\">')
              p.write_text(t, encoding='utf-8')
          "

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
