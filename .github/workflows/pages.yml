name: GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Push built site to gh-pages branch (Settings → Pages → Deploy from branch → gh-pages).
permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build YAML bank
        run: python scripts/build.py

      - name: Export static demo
        run: python scripts/export_static_demo.py

      - name: Patch demo HTML for relative assets
        run: python scripts/patch_docs_html.py

      - name: Publish to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: docs
          force_orphan: true
